[project]
name = "quorum"
version = "0.1.0"
description = "Multi-agent equity research desk: five AI style analysts, a bull/bear/judge debate, an earnings desk, and a paper portfolio graded out of sample."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    "feedparser>=6.0.14",
    "jinja2>=3.1.6",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.0"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
