# Runs the pipeline after every US market close, commits the record, and publishes the site to GitHub Pages.
#
# One-time setup:
#   1. Settings > Secrets and variables > Actions > New repository secret: ANTHROPIC_API_KEY
#   2. Settings > Pages > Build and deployment > Source: GitHub Actions
#   3. Actions > Daily run > Run workflow (starts the record today instead of waiting for the schedule)
name: Daily run

on:
  schedule:
    - cron: "30 21 * * 1-5" # 21:30 UTC = 5:30pm EDT / 4:30pm EST, after the close is final
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/**", "quorum/site.py"] # design changes rebuild the site without a new run

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: quorum
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run the pipeline
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m quorum.pipeline run

      - name: Commit the record
        if: github.event_name != 'push'
        run: |
          git config user.name "quorum-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quorum.db
          git diff --cached --quiet || git commit -m "Record for $(date -u +%Y-%m-%d)"
          git push

      - name: Verify the record has not been edited
        run: python -m quorum.ledger verify

      - name: Build the site
        env:
          QUORUM_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python -m quorum.site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
